name: Build and publish Docker image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - '*'
      - '*.*'
      - '*.*.*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine Docker image tags
        id: image-tags
        run: |
          tags="jrvolt/gh_watcher:latest jrvolt/gh_watcher:${GITHUB_SHA}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            ref_name="${GITHUB_REF#refs/tags/}"
            docker_tag="${ref_name#v}"
            tags="jrvolt/gh_watcher:${docker_tag} jrvolt/gh_watcher:latest jrvolt/gh_watcher:${GITHUB_SHA}"
          fi
          printf '%s\n' $tags > /tmp/docker-tags
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/docker-tags >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.image-tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
